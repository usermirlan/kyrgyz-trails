services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tooarna
      POSTGRES_USER: tooarna
      POSTGRES_PASSWORD: tooarna
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tooarna"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    restart: on-failure
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: on-failure
    environment:
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
